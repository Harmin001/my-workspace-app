<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的专属工作台</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2383e2">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

<!-- 注意这里：去掉了 css/ 文件夹 -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sidebar">
<div class="sidebar-title">🚀 我的工作台<div class="sync-controls"><div class="p2p-dot" id="p2p-indicator" title="未连接"></div><span class="sync-status-badge offline" id="sync-status-badge"><span id="sync-status-text">离线</span></span><button class="btn btn-sm btn-sync-now" id="btn-sync-now" onclick="manualSyncNow()" title="立即同步">立即同步</button></div></div>
<div class="nav-item" data-target="year">📊 全年</div>
<div class="nav-item" data-target="month">📅 月计划</div>
<div class="nav-item" data-target="week">🗓️ 周计划</div>
<div class="nav-item" data-target="day" style="justify-content:space-between; padding-right:6px;"><span>📝 日计划</span><span onclick="jumpToToday(event)" style="color:var(--accent-color);font-weight:700;font-size:var(--font-hint);padding:2px 6px;border-radius:4px;background:rgba(35,131,226,.1);" title="回到今天">📍 今天</span></div>
<div class="nav-item" data-target="methods">📚 学习方法</div>
<div class="nav-item" data-target="settings">⚙️ 设置</div>
<div class="sidebar-footer">
<div class="sidebar-goal-box"><div class="sidebar-goal-title">🎯 我的目标</div><div class="sidebar-goal-input" id="yearly-goals" contenteditable="true" placeholder="写下核心目标..."></div></div>
<div class="fixed-progress-bars">
<div class="prog-row" onclick="openStatsModal('year')"><div class="prog-label-row"><span>年完成度</span><span id="prog-year-text">0%</span></div><div class="prog-bar-bg"><div class="prog-bar-fill" id="prog-year-fill" style="background:#2383e2;"></div></div></div>
<div class="prog-row" onclick="openStatsModal('month')"><div class="prog-label-row"><span>月完成度</span><span id="prog-month-text">0%</span></div><div class="prog-bar-bg"><div class="prog-bar-fill" id="prog-month-fill" style="background:#f2994a;"></div></div></div>
<div class="prog-row" onclick="openStatsModal('week')"><div class="prog-label-row"><span>周完成度</span><span id="prog-week-text">0%</span></div><div class="prog-bar-bg"><div class="prog-bar-fill" id="prog-week-fill" style="background:#9b51e0;"></div></div></div>
<div class="prog-row" onclick="openStatsModal('day')"><div class="prog-label-row"><span>日完成度</span><span id="prog-day-text">0%</span></div><div class="prog-bar-bg"><div class="prog-bar-fill" id="prog-day-fill" style="background:#27ae60;"></div></div></div>
</div>
<div class="energy-rpg-panel">
<div class="rpg-card" id="rpg-card">
<div class="rpg-energy-section">
<div class="energy-left">
    <div class="energy-header"><span>⚡ 今日精力</span></div>
    <div class="energy-bar-bg"><div class="energy-bar-fill" id="energy-fill" style="width:100%;"></div></div>
    <div class="energy-footer"><span id="energy-text">200 / 200</span></div>
    <div class="energy-warn" id="energy-warn" style="display:none;">⚠️ 精力过低，注意休息！</div>
</div>
<div class="energy-right">
    <button class="btn-energy-restore" onclick="restoreEnergy('nap')" id="btn-nap" title="恢复精力">😴+50</button>
    <button class="btn-energy-restore" onclick="restoreEnergy('break')" id="btn-break" title="恢复精力">☕+20</button>
</div>
</div>
<div class="rpg-card-main" onclick="openRPGModal()">
<div class="rpg-header"><span class="rpg-level" id="rpg-level">Lv.1</span><span class="rpg-title" id="rpg-title">新手</span></div>
<div class="rpg-exp-bar" id="rpg-exp-bar-wrap"><div class="rpg-exp-fill" id="rpg-exp-fill" style="width:0%;"></div></div>
<div class="rpg-exp-text" id="rpg-exp-text">0 / 100 EXP</div>
<div class="rpg-attrs">
<div class="rpg-attr"><span>📚 智力</span><b id="rpg-int">0</b></div>
<div class="rpg-attr"><span>💪 体力</span><b id="rpg-vit">0</b></div>
<div class="rpg-attr"><span>🎨 创造力</span><b id="rpg-cre">0</b></div>
<div class="rpg-attr"><span>🎯 专注</span><b id="rpg-foc">0</b></div>
<div class="rpg-attr"><span>🔥 毅力</span><b id="rpg-wil">0</b></div>
</div>
<div class="rpg-tip">👉 点击查看详细属性</div>
</div>
</div>
</div>
</div>
</div>
<div class="mobile-rpg-fab" id="mobile-rpg-fab" onclick="openRPGModal()"><span id="mobile-rpg-lv">Lv.1</span><span id="mobile-rpg-energy">⚡200</span></div>

<!-- 注入主内容区 -->
<div id="main-content-placeholder"></div>

<!-- 注意这里：去掉了 js/ 文件夹 -->
<script src="1-core.js"></script>
<script src="2-utils.js"></script>
<script src="3-templates.js"></script>
<script src="4-rpg.js"></script>
<script src="5-methods.js"></script>
<script src="6-render.js"></script>
<script src="7-events.js"></script>
<script src="8-sync.js"></script>
<script src="9-init.js"></script>
</body>
</html>
